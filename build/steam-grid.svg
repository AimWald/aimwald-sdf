<?xml version="1.0" encoding="UTF-8"?>
<!-- Steam Grid Image: 460x215 (wide format for library) -->
<svg width="460" height="215" viewBox="0 0 460 215" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="460" height="215" fill="#1a1a3a"/>

  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a4a8a;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1a1a3a;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <rect width="460" height="215" fill="url(#grad)"/>

  <!-- Wings (left side) -->
  <path d="M 80 80 Q 40 70 30 90 Q 20 110 40 120 Q 60 130 80 115 Z"
        fill="#88aaff" opacity="0.5"/>
  <path d="M 80 95 Q 50 85 40 100 Q 35 110 50 115 Q 65 120 80 110 Z"
        fill="#aaccff" opacity="0.4"/>

  <!-- Wings (right side) -->
  <path d="M 380 80 Q 420 70 430 90 Q 440 110 420 120 Q 400 130 380 115 Z"
        fill="#88aaff" opacity="0.5"/>
  <path d="M 380 95 Q 410 85 420 100 Q 425 110 410 115 Q 395 120 380 110 Z"
        fill="#aaccff" opacity="0.4"/>

  <!-- Main Title -->
  <text x="230" y="85" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="#d0d0e8" letter-spacing="4">AimWald</text>

  <!-- SDF -->
  <text x="230" y="140" font-family="Arial, sans-serif" font-size="64" font-weight="bold"
        text-anchor="middle" fill="#88aaff" stroke="#2a4a8a" stroke-width="2">SDF</text>

  <!-- Subtitle -->
  <text x="230" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="normal"
        text-anchor="middle" fill="#5a8ad8" opacity="0.8">Steam Deck • Multiboxing • Automation</text>

  <!-- Gamepad Icon -->
  <g transform="translate(230, 195)">
    <rect x="-20" y="-8" width="40" height="16" rx="6" fill="#5a8ad8" opacity="0.5"/>
    <circle cx="-10" cy="0" r="3" fill="#d0d0e8"/>
    <circle cx="10" cy="0" r="3" fill="#d0d0e8"/>
  </g>

  <!-- Border -->
  <rect x="2" y="2" width="456" height="211" fill="none" stroke="#5a8ad8" stroke-width="2" opacity="0.4"/>
</svg>
