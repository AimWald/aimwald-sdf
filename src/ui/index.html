<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Flyff Wrapper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 30px;
      overflow: hidden;
      background: #12122a;
      color: #d0d0e8;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      user-select: none;
      /* Gesamte Toolbar ist ziehbar – Buttons überschreiben das */
      -webkit-app-region: drag;
    }

    .toolbar {
      display: flex;
      align-items: center;
      height: 30px;
      padding: 0 6px;
      gap: 3px;
    }

    /* Alle interaktiven Elemente aus der Drag-Region herausnehmen */
    button, .no-drag {
      -webkit-app-region: no-drag;
    }

    button {
      height: 22px;
      padding: 0 7px;
      border: 1px solid #3a3a6a;
      border-radius: 3px;
      background: #1e1e4a;
      color: #d0d0e8;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }
    button:hover  { background: #2a2a6a; }

    /* Aktiver Account */
    button.active {
      background: #2a4a8a;
      border-color: #5a8ad8;
      color: #c8dcff;
    }

    /* Automation läuft */
    button.running {
      background: #1a4a1a;
      border-color: #3a9a3a;
      color: #88ee88;
    }

    .sep {
      -webkit-app-region: no-drag;
      width: 1px;
      height: 18px;
      background: #3a3a5a;
      margin: 0 2px;
    }

    .label {
      color: #666;
      font-size: 10px;
      padding: 0 3px;
    }

    #btn-close {
      background: #4a1a1a;
      border-color: #8a3a3a;
      margin-left: auto;
    }
    #btn-close:hover { background: #7a2a2a; }
  </style>
</head>
<body>
  <div class="toolbar">

    <!-- Account-Auswahl -->
    <span class="label no-drag">Acc:</span>
    <button id="btn-acc1" class="active" onclick="switchAccount('account1')" title="Account 1 anzeigen">1</button>
    <button id="btn-acc2"               onclick="switchAccount('account2')" title="Account 2 anzeigen">2</button>

    <div class="sep"></div>

    <!-- Automation Account 1 -->
    <span class="label no-drag">Acc1:</span>
    <button id="btn-start-account1" onclick="startAutomation('account1')" title="Automation Account 1 starten (F10)">▶</button>
    <button id="btn-stop-account1"  onclick="stopAutomation('account1')"  title="Automation Account 1 stoppen">■</button>

    <div class="sep"></div>

    <!-- Automation Account 2 -->
    <span class="label no-drag">Acc2:</span>
    <button id="btn-start-account2" onclick="startAutomation('account2')" title="Automation Account 2 starten">▶</button>
    <button id="btn-stop-account2"  onclick="stopAutomation('account2')"  title="Automation Account 2 stoppen">■</button>

    <div class="sep"></div>

    <button onclick="window.flyff.openSettings()" title="Einstellungen (Tasten, Intervalle, Hotkeys)">⚙ Settings</button>

    <!-- Gamepad-Status-Indikator -->
    <span id="gp-status" class="label no-drag" title="Gamepad-Status">🎮 <span id="gp-label">–</span></span>

    <!-- Schließen ganz rechts -->
    <button id="btn-close" onclick="window.flyff.quitApp()" title="App beenden">✕</button>
  </div>

  <script>
    // ── Initialisierung ───────────────────────────────────────────────────────

    async function init() {
      const state = await window.flyff.getState();
      applyAccountState(state.activeAccount);
      applyRunningState('account1', state.account1Running);
      applyRunningState('account2', state.account2Running);

      // Gamepad-Config laden und Polling starten.
      // Polling läuft hier im Renderer-Hauptkontext, weil navigator.getGamepads()
      // im isolierten Preload-Kontext nicht zuverlässig verfügbar ist.
      const gpConfig = await window.flyff.getGamepadConfig();
      startGamepadPolling(gpConfig);
    }

    // ── UI-Hilfsfunktionen ────────────────────────────────────────────────────

    function applyAccountState(active) {
      document.getElementById('btn-acc1').classList.toggle('active', active === 'account1');
      document.getElementById('btn-acc2').classList.toggle('active', active === 'account2');
    }

    function applyRunningState(account, running) {
      document.getElementById(`btn-start-${account}`).classList.toggle('running', running);
      document.getElementById(`btn-stop-${account}` ).classList.toggle('running', running);
    }

    // ── Button-Handler ────────────────────────────────────────────────────────

    function switchAccount(account) {
      window.flyff.switchAccount(account);
      applyAccountState(account);
    }

    function startAutomation(account) {
      window.flyff.startAutomation(account);
      applyRunningState(account, true);
    }

    function stopAutomation(account) {
      window.flyff.stopAutomation(account);
      applyRunningState(account, false);
    }

    // ── Events vom Main-Prozess (z.B. via F9 / F10) ───────────────────────────

    window.flyff.on('account-switched', (account) => {
      applyAccountState(account);
    });

    window.flyff.on('automation-state-changed', ({ account, running }) => {
      applyRunningState(account, running);
    });

    // ── Gamepad-Polling (läuft im Renderer-Hauptkontext) ─────────────────────

    function startGamepadPolling(buttonMap) {
      const WASD_THRESHOLD = 0.3;   // Ab diesem Wert gilt der Stick als "gedrückt"
      const SPEED_RIGHT    = 6;     // Rechter Stick: Maus-Pixel pro Tick
      const prevBtns       = {};
      const gpLabel        = document.getElementById('gp-label');

      // Merkt sich welche WASD-Tasten gerade vom Stick gehalten werden
      const heldKeys = { W: false, A: false, S: false, D: false };

      function setKey(keyCode, shouldBePressed) {
        if (shouldBePressed === heldKeys[keyCode]) return; // keine Änderung
        heldKeys[keyCode] = shouldBePressed;
        if (shouldBePressed) {
          window.flyff.sendGamepadKeyDown(keyCode);
        } else {
          window.flyff.sendGamepadKeyUp(keyCode);
        }
      }

      function releaseAllWASD() {
        Object.keys(heldKeys).forEach(k => setKey(k, false));
      }

      window.addEventListener('gamepadconnected', (e) => {
        console.log('[Gamepad] Verbunden:', e.gamepad.id, '| Achsen:', e.gamepad.axes.length, '| Buttons:', e.gamepad.buttons.length);
      });
      window.addEventListener('gamepaddisconnected', (e) => {
        console.log('[Gamepad] Getrennt:', e.gamepad.id);
        releaseAllWASD();
      });

      setInterval(() => {
        const pads = navigator.getGamepads();
        const connected = Array.from(pads).filter(Boolean);

        // Status-Anzeige aktualisieren
        if (connected.length === 0) {
          gpLabel.textContent = '–';
          gpLabel.style.color = '#555';
          releaseAllWASD();
          return;
        }
        gpLabel.textContent = connected.length + ' OK';
        gpLabel.style.color = '#44ee44';

        for (const gp of connected) {
          const lx = gp.axes[0] || 0;
          const ly = gp.axes[1] || 0;

          // Linker Stick → WASD (Charakter-Bewegung)
          setKey('D', lx >  WASD_THRESHOLD);
          setKey('A', lx < -WASD_THRESHOLD);
          setKey('S', ly >  WASD_THRESHOLD);
          setKey('W', ly < -WASD_THRESHOLD);

          // Rechter Stick (axes 2+3) → Mausbewegung (Kamera)
          const rx = gp.axes[2] || 0;
          const ry = gp.axes[3] || 0;
          const dx = Math.abs(rx) > 0.15 ? rx * SPEED_RIGHT : 0;
          const dy = Math.abs(ry) > 0.15 ? ry * SPEED_RIGHT : 0;
          if (dx !== 0 || dy !== 0) {
            window.flyff.sendGamepadMove(dx, dy);
          }

          // Buttons mit Edge-Detection und Sonderaktionen
          gp.buttons.forEach((btn, idx) => {
            const stateKey   = `${gp.index}_${idx}`;
            const pressed    = btn.pressed;
            const wasPressed = prevBtns[stateKey];
            const action     = buttonMap && buttonMap[String(idx)];

            if (pressed && !wasPressed) {
              // Button gerade gedrückt
              if (action === '__LCLICK') {
                window.flyff.sendMouseDown('left');
                setTimeout(() => window.flyff.sendMouseUp('left'), 80);
              } else if (action === '__RHOLD') {
                window.flyff.sendMouseDown('right');
              } else if (action) {
                window.flyff.sendGamepadButton(action);
              }
            } else if (!pressed && wasPressed) {
              // Button losgelassen – Rechtsklick freigeben
              if (action === '__RHOLD') {
                window.flyff.sendMouseUp('right');
              }
            }
            prevBtns[stateKey] = pressed;
          });
        }
      }, 16);
    }

    init();
  </script>
</body>
</html>
